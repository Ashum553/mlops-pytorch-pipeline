seed: 42

data:
  data_dir: data
  batch_size: 64
  num_workers: 2

model:
  architecture: cnn
  num_classes: 10

training:
  epochs: 10
  learning_rate: 0.001
  weight_decay: 0.0001

early_stopping:
  enabled: true
  patience: 3
  min_delta: 0.001

checkpoint:
  dir: artifacts/checkpoints
  filename: best_model.pt
