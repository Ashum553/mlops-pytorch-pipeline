apiVersion: autoscaling/v2

kind: HorizontalPodAutoscaler

metadata:
  name: cifar10-serving-hpa
  namespace: mlops-cifar10

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cifar10-serving

  minReplicas: 2
  maxReplicas: 4

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

