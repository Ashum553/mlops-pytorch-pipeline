apiVersion: v1

kind: ConfigMap

metadata:
  name: training-config
  namespace: mlops-cifar10

data:
  training_config.yaml: |
    seed: 42

    data:
      data_dir: /app/data
      batch_size: 64
      num_workers: 2

    model:
      architecture: cnn
      num_classes: 10

    training:
      epochs: 10
      learning_rate: 0.001
      weight_decay: 0.0001

    early_stopping:
      enabled: true
      patience: 3
      min_delta: 0.001

    checkpoint:
      dir: /app/checkpoints
      filename: best_model.pt
